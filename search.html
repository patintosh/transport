<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Résultats de recherche</title>

    <!-- Scripts chargés proprement -->
    <script src="fuse.min.js"></script>
    <script src="search.js" defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #fafafa;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        #search {
            width: 60%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 4px;
            outline: none;
        }
        #searchButton {
            padding: 10px 18px;
            font-size: 16px;
            margin-left: 8px;
            border: none;
            background-color: #0078d4;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        #searchButton:hover {
            background-color: #005fa3;
        }
        .result {
            background: white;
            padding: 12px;
            margin-top: 14px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .result-title {
            font-size: 18px;
            font-weight: bold;
            color: #0078d4;
            margin-bottom: 4px;
        }
        .result-year {
            color: #666;
            font-size: 13px;
        }
    </style>
</head>

<body>

<h1>Résultats</h1>

<input id="search" type="text" placeholder="Tapez votre recherche ¦">
<button id="searchButton">Rechercher</button>

<div id="results"></div>

</body>
</html>
