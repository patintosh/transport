<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bibliothèque Patrice Salini</title>
    <style>
        :root { --pdf: #d93025; --web: #1a73e8; }
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; margin: 0; }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .search-area { position: sticky; top: 0; background: white; padding: 20px; border-bottom: 1px solid #ddd; z-index: 100; }
        #search-input { width: 100%; padding: 12px; font-size: 1.1rem; border-radius: 8px; border: 1px solid #ccc; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; border-left: 5px solid #ccc; margin-bottom: 10px; }
        .is-pdf { border-left-color: var(--pdf); }
        .is-web { border-left-color: var(--web); }
        .card a { color: #0071e3; text-decoration: none; font-weight: bold; }
        .meta { font-size: 0.8rem; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="search-area">
        <input type="text" id="search-input" placeholder="Recherche (rail, route, 2026...)">
        <p id="counter"></p>
    </div>
    <div class="grid">
        <section><h2>📄 PDF</h2><div id="pdf-list"></div></section>
        <section><h2>🌐 WEB</h2><div id="web-list"></div></section>
    </div>
</div>
<script>
let DATA = [];
async function start() {
    const r = await fetch('index.json?v=' + Date.now());
    DATA = await r.json();
    render();
}
function render() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const pL = document.getElementById('pdf-list');
    const wL = document.getElementById('web-list');
    pL.innerHTML = ""; wL.innerHTML = "";

    const filtered = DATA.filter(it => {
        return (it.title + " " + (it.description || "") + " " + (it.url || "")).toLowerCase().includes(q);
    });

    filtered.forEach(it => {
        const url = it.url || "";
        const isPdf = url.toLowerCase().endsWith('.pdf');
        const html = `<div class="card ${isPdf?'is-pdf':'is-web'}">
            <a href="${url}" target="_blank">${it.description || it.title}</a>
            <div class="meta">Ref: ${it.title} | Date: ${it.date}</div>
        </div>`;
        if(isPdf) pL.innerHTML += html; else wL.innerHTML += html;
    });
    document.getElementById('counter').innerText = filtered.length + " résultats";
}
document.getElementById('search-input').oninput = render;
window.onload = start;
</script>
</body>
</html>
