<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bibliothèque Patrice Salini</title>
    <style>
        :root { --accent: #0071e3; --pdf: #d93025; --warn: #ffcc00; --gray: #6e6e73; }
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; margin: 0; color: #1d1d1f; }
        .header-box { background: white; padding: 25px; text-align: center; border-bottom: 1px solid #d2d2d7; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .search-area { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #ccc; font-size: 1.2rem; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 30px; }
        .card { background: #fff; padding: 20px; border-radius: 12px; border-left: 6px solid #ccc; margin-bottom: 15px; }
        .is-pdf { border-left-color: var(--pdf); }
        .is-html { border-left-color: #28a745; }
        .desc-link { color: var(--accent); text-decoration: none; font-weight: 700; font-size: 1.1rem; display: block; margin-bottom: 10px; }
        .date-meta { font-size: 0.8rem; color: var(--gray); margin-top: 10px; }
        #count { font-weight: bold; color: var(--accent); margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="header-box">
    <h1>Bibliothèque Patrice Salini</h1>
    <p>Portail <strong>Penser les Transports</strong> (Christian Reynaud & Patrice Salini) : 
       <a href="https://pensertransports.simdif.com" target="_blank">Visiter le site</a></p>
    <p>Éditeur : <a href="https://www.editions-harmattan.fr" target="_blank">L'Harmattan</a></p>
</div>

<div class="container">
    <div class="search-area">
        <input type="text" id="q" placeholder="Tapez votre recherche ici..." oninput="doSearch()">
    </div>
    <div id="count"></div>
    <div class="grid">
        <section><h2>📄 Documents PDF</h2><div id="pdf-list"></div></section>
        <section><h2>🌐 Onglets Web</h2><div id="web-list"></div></section>
    </div>
</div>

<script>
let DATA = []; 
const TABS = [
    {d: "Le Rail : Politiques et infrastructures ferroviaires", u: "https://pensertransports.simdif.com/la-prospective.html"},
    {d: "La Route : Économie et régulation", u: "https://pensertransports.simdif.com/la-route.html"},
    {d: "Le Combiné : Multimodalité et ferroutage", u: "https://pensertransports.simdif.com/le-combine.html"},
    {d: "La Prospective : Évolutions et politiques", u: "https://pensertransports.simdif.com/la-prospective.html"}
];

async function init() {
    const res = await fetch('index.json?v=' + Date.now()).then(r => r.json());
    DATA = res.filter(it => it.url.toLowerCase().endsWith('.pdf'));
    doSearch();
}

function doSearch() {
    const q = document.getElementById('q').value.toLowerCase().trim();
    const pL = document.getElementById('pdf-list'); const wL = document.getElementById('web-list');
    pL.innerHTML = ""; wL.innerHTML = "";

    // RECHERCHE PDF : ON SCANNE TOUT LE CONTENU DISPONIBLE
    let resPdf = DATA.filter(it => {
        const fullContent = (it.title + " " + it.description + " " + it.url).toLowerCase();
        return !q || fullContent.includes(q);
    }).sort((a,b) => b.date.localeCompare(a.date));

    resPdf.forEach(it => {
        // Si pas de description, on met un extrait du nom de fichier
        const linkText = it.description && it.description.length > 5 ? it.description.substring(0, 100) : "Document : " + it.url;
        pL.insertAdjacentHTML('beforeend', `
            <div class="card is-pdf">
                <a href="${it.url}" target="_blank" class="desc-link">${linkText}</a>
                <div class="date-meta">Date : ${it.date} | Fichier : ${it.url}</div>
            </div>`);
    });

    // RECHERCHE WEB
    TABS.forEach(t => {
        if (!q || t.d.toLowerCase().includes(q)) {
            wL.insertAdjacentHTML('beforeend', `
                <div class="card is-html">
                    <a href="${t.u}" target="_blank" class="desc-link">${t.d}</a>
                </div>`);
        }
    });
    document.getElementById('count').innerText = resPdf.length + " document(s) trouvé(s)";
}
window.onload = init;
</script>
</body>
</html>
