<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bibliothèque Patrice Salini</title>
    <style>
        :root { --accent: #0071e3; --pdf: #d93025; --web: #1a73e8; }
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; margin: 0; color: #1d1d1f; }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px; background: white; border-bottom: 1px solid #ddd; }
        .search-area { position: sticky; top: 0; background: white; padding: 20px; z-index: 100; border-bottom: 1px solid #eee; }
        #search-input { width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 1.1rem; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 20px; }
        .card { background: white; padding: 18px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid #ccc; }
        .card.is-pdf { border-left-color: var(--pdf); }
        .card.is-web { border-left-color: var(--web); }
        .card a { color: var(--accent); text-decoration: none; font-weight: bold; font-size: 1.1rem; display: block; }
        .meta { font-size: 0.85rem; color: #666; margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; }
        @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<header>
    <h1>Ma Bibliothèque Numérique</h1>
</header>
<div class="wrap">
    <div class="search-area">
        <input type="text" id="search-input" placeholder="Rechercher par mot-clé ou année...">
        <p id="counter" style="margin-top:10px; font-weight:bold;">Chargement...</p>
    </div>
    <div class="grid">
        <section><h2>📄 PDF (Archives)</h2><div id="pdf-list"></div></section>
        <section><h2>🌐 WEB (Articles)</h2><div id="web-list"></div></section>
    </div>
</div>
<script>
let DATA = [];

function findYear(it) {
    // On scanne date, titre et description pour trouver 4 chiffres (19xx ou 20xx)
    const blob = (it.date + " " + it.title + " " + (it.description || "")).replace(/\//g, " ");
    const match = blob.match(/\b(19|20)\d{2}\b/);
    return match ? parseInt(match[0]) : 0;
}

async function init() {
    const r = await fetch('index.json?v=' + Date.now());
    DATA = await r.json();
    render();
}

function render() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const pList = document.getElementById('pdf-list');
    const wList = document.getElementById('web-list');
    pList.innerHTML = ""; wList.innerHTML = "";

    // TRI LOGIQUE : Par année trouvée dans le JSON, du plus récent au plus vieux
    const sorted = [...DATA].sort((a,b) => findYear(b) - findYear(a));

    const filtered = sorted.filter(it => {
        const searchBlob = (it.title + " " + (it.description || "") + " " + (it.date || "")).toLowerCase();
        return searchBlob.includes(q);
    });

    filtered.forEach(it => {
        const path = it.url || it.path || "";
        const fileName = path.split('/').pop(); 
        const isPdf = fileName.toLowerCase().endsWith('.pdf');
        
        // AFFICHAGE : On privilégie la description si elle existe
        let displayTitle = (it.description && it.description.length > 5) ? it.description.split('.')[0] : it.title;

        const card = `
            <div class="card ${isPdf?'is-pdf':'is-web'}">
                <a href="${isPdf ? fileName : path}" target="_blank">${displayTitle}</a>
                <div class="meta">📅 ${it.date || 'Non daté'} | Réf: ${it.title}</div>
            </div>`;
        
        if (isPdf) pList.insertAdjacentHTML('beforeend', card);
        else wList.insertAdjacentHTML('beforeend', card);
    });
    document.getElementById('counter').innerText = filtered.length + " document(s)";
}

document.getElementById('search-input').oninput = render;
window.onload = init;
</script>
</body>
</html>
