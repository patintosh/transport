<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bibliothèque Patrice Salini</title>
    <style>
        :root { --accent: #0071e3; --pdf: #d93025; --web: #1a73e8; }
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; margin: 0; color: #1d1d1f; }
        .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px; background: white; border-bottom: 1px solid #ddd; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 5px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .is-pdf { border-left-color: var(--pdf); }
        .is-web { border-left-color: var(--web); }
        .card a { color: var(--accent); text-decoration: none; font-weight: bold; font-size: 1.1rem; }
        .meta { font-size: 0.85rem; color: #666; margin-top: 8px; }
        .search-area { position: sticky; top: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); padding: 20px; z-index: 100; border-bottom: 1px solid #eee; }
        #search-input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #ccc; font-size: 1.1rem; }
        @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<header>
    <h1>Ma Bibliothèque Numérique</h1>
    <p>Patrice Salini - Transports & Mobilités</p>
</header>
<div class="wrap">
    <div class="search-area">
        <input type="text" id="search-input" placeholder="Rechercher (ex: rail, fret, fluvial, sncf...)">
        <p id="counter" style="font-weight:bold; margin-top:10px;">Chargement...</p>
    </div>
    <div class="grid">
        <section><h2>📄 Archives PDF</h2><div id="pdf-list"></div></section>
        <section><h2>🌐 Articles WEB</h2><div id="web-list"></div></section>
    </div>
</div>
<script>
let DATA = [];
// Intégration de ton glossaire inverse
const GLOSSAIRE = {
    "marchandises": ["fret", "choses"], "fret": ["marchandises"],
    "voyageurs": ["passagers", "usagers", "personnes"],
    "rail": ["ferroviaire", "ferré", "chemin de fer", "sncf", "train"],
    "camion": ["poids lourd", "pl", "véhicule utilitaire", "routier"],
    "fluvial": ["canal", "canaux", "voie d'eau", "vn", "péniche"],
    "combiné": ["intermodal", "ferroutage", "multimodal", "rail-route"],
    "cabotage": ["sss", "short-sea", "maritime"],
    "plan": ["planification", "commissariat", "stratégie"]
};

async function start() {
    const r = await fetch('index.json?v=' + Date.now());
    DATA = await r.json();
    update();
}

function update() {
    const q = document.getElementById('search-input').value.toLowerCase().trim();
    let terms = [q];
    for (let key in GLOSSAIRE) {
        if (q.includes(key) || GLOSSAIRE[key].some(a => q.includes(a))) {
            terms = [...new Set([...terms, key, ...GLOSSAIRE[key]])];
        }
    }

    let filtered = DATA.filter(it => {
        if (!q) return true;
        const txt = (it.title + " " + (it.description || "")).toLowerCase();
        return terms.some(t => txt.includes(t));
    });

    // Tri par date (2026 en haut)
    filtered.sort((a,b) => (b.title.includes("a0003") ? 2026 : 0) - (a.title.includes("a0003") ? 2026 : 0));

    const pL = document.getElementById('pdf-list');
    const wL = document.getElementById('web-list');
    pL.innerHTML = ""; wL.innerHTML = "";

    filtered.forEach(it => {
        const url = (it.url || it.path || "");
        const isPdf = url.toLowerCase().includes('.pdf');
        const html = `<div class="card ${isPdf?'is-pdf':'is-web'}">
            <a href="${url}" target="_blank">${it.description?it.description.substring(0,90)+'...':it.title}</a>
            <div class="meta">📅 ${it.date} | Réf: ${it.title}</div>
        </div>`;
        if(isPdf) pL.innerHTML += html; else wL.innerHTML += html;
    });
    document.getElementById('counter').innerText = filtered.length + " document(s)";
}
document.getElementById('search-input').oninput = update;
window.onload = start;
</script>
</body>
</html>
