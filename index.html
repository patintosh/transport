        const glossary = {
            "marchandises": ["fret", "choses"],
            "fret": ["marchandises"],
            "choses": ["marchandises"],
            "voyageurs": ["passagers", "usagers", "personnes"],
            "passagers": ["voyageurs"],
            "usagers": ["voyageurs"],
            "personnes": ["voyageurs"],
            "rail": ["ferroviaire", "ferré", "chemin de fer"],
            "ferroviaire": ["rail"],
            "ferré": ["rail"],
            "chemin de fer": ["rail"],
            "camion": ["poids lourd", "pl", "véhicule utilitaire", "véhicule industriel", "véhicule routier"],
            "poids lourd": ["camion"],
            "pl": ["camion"],
            "véhicule utilitaire": ["camion"],
            "véhicule industriel": ["camion"],
            "véhicule routier": ["camion"],
            "routier": ["trm"],
            "par route": ["routier"],
            "routière": ["trm"],
            "transport routier": ["routier"],
            "transport": ["déplacement", "mobilité", "locomotion"],
            "déplacement": ["transport"],
            "mobilité": ["transport"],
            "locomotion": ["transport"],
            "combiné": ["intermodal", "ferroutage", "multimodal", "piggyback", "huckepack", "transport combiné", "rail-route"],
            "intermodal": ["combiné"],
            "ferroutage": ["combiné"],
            "multimodal": ["combiné"],
            "piggyback": ["combiné"],
            "huckepack": ["combiné"],
            "transport combiné": ["combiné"],
            "rail-route": ["combiné"],
            "ro-ro": ["transroulage maritime", "roll on-roll off"],
            "transroulage maritime": ["ro-ro"],
            "roll on-roll off": ["ro-ro"],
            "lo-lo": ["lift-on-lift-out"],
            "lift-on-lift-out": ["lo-lo"],
            "route-roulante": ["rollande landstrasse"],
            "rollande landstrasse": ["route-roulante"],
            "uti": ["unité de transport intermodal", "conteneurs", "caisses mobiles"],
            "unité de transport intermodal": ["uti"],
            "conteneurs": ["uti"],
            "caisses mobiles": ["uti"],
            "voie navigable": ["vn", "voie d'eau"]
        };

        let isRecentSort = true;

        // Normalisation de texte pour enlever accents et majuscules
        function cleanText(text) {
            return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        // Récupération des synonymes associés à un terme de recherche
        function getSearchTerms(query) {
            const terms = [query];
            for (const [key, synonyms] of Object.entries(glossary)) {
                if (cleanText(key).includes(query)) {
                    synonyms.forEach(syn => terms.push(cleanText(syn)));
                }
                synonyms.forEach(syn => {
                    if (cleanText(syn).includes(query)) {
                        terms.push(cleanText(key));
                    }
                });
            }
            return [...new Set(terms)];
        }

        // Basculer l'état du tri (Récent vs Ancien)
        function toggleSort() {
            isRecentSort = !isRecentSort;
            document.getElementById('sortBtn').textContent = isRecentSort ? "▼ Récent" : "▲ Ancien";
            applyFilterAndRender();
        }

        // Génération d'un bloc de carte HTML pour un document
        function createCard(doc) {
            const isVideo = doc.url.includes('youtu.be') || doc.url.includes('youtube.com');
            const actionBtn = isVideo 
                ? `<a href="${doc.url}" target="_blank" class="btn-action btn-view" style="background: var(--video);" title="Voir la vidéo">▶</a>`
                : `<a href="${doc.url}" target="_blank" class="btn-action btn-view" title="Ouvrir le PDF">👁</a>`;
            const downloadBtn = isVideo ? '' : `<a href="${doc.url}" download class="btn-action btn-dl" title="Télécharger">↓</a>`;

            return `
                <div class="card">
                    <div style="flex-grow: 1;">
                        <div class="title">${doc.title}</div>
                        <div class="date-tag">${doc.date || 'Sans date'}</div>
                    </div>
                    <div class="actions">
                        ${actionBtn}
                        ${downloadBtn}
                    </div>
                </div>
            `;
        }

        // Algorithme principal de filtrage, tri et affichage
        function applyFilterAndRender() {
            const rawQuery = cleanText(document.getElementById('search').value.trim());
            const searchTerms = rawQuery ? getSearchTerms(rawQuery) : [];

            // Filtrage global
            let filteredDocs = docs.filter(doc => {
                if (!rawQuery) return true;
                const docTitle = cleanText(doc.title);
                const docKeywords = cleanText(doc.keywords || '');
                return searchTerms.some(term => docTitle.includes(term) || docKeywords.includes(term));
            });

            // Tri par année (et par date si possible)
            filteredDocs.sort((a, b) => {
                const yearA = a.year || 0;
                const yearB = b.year || 0;
                return isRecentSort ? (yearB - yearA) : (yearA - yearB);
            });

            // Rendu de la liste principale
            const globalListContainer = document.getElementById('global-list');
            globalListContainer.innerHTML = filteredDocs.map(doc => createCard(doc)).join('');

            // Mise à jour du compteur
            document.getElementById('counter').textContent = `${filteredDocs.length} document(s) trouvé(s)`;

            // Rendu de la liste Focus thématique (Filtre strict Corse & DSP)
            const focusListContainer = document.getElementById('focus-list');
            const focusDocs = filteredDocs.filter(doc => {
                const docTitle = cleanText(doc.title);
                const docKeywords = cleanText(doc.keywords || '');
                return (docTitle.includes('corse') || docKeywords.includes('corse')) && 
                       (docTitle.includes('dsp') || docKeywords.includes('dsp') || docTitle.includes('service public') || docTitle.includes('osp'));
            });
            focusListContainer.innerHTML = focusDocs.map(doc => createCard(doc)).join('');
        }

        // Écouteur d'événement sur la zone de recherche
        document.getElementById('search').addEventListener('input', applyFilterAndRender);

        // Initialisation de la page au chargement
        window.addEventListener('DOMContentLoaded', applyFilterAndRender);
    </script>
