<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliothèque numérique - Patrice Salini</title>
    <style>
        :root { --bg-color: #f5f5f7; --accent: #0071e3; --text: #1d1d1f; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg-color); color: var(--text); }
        .wrap { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .search-area { position: sticky; top: 0; background: var(--bg-color); padding: 20px 0; z-index: 10; }
        #search-input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #d2d2d7; font-size: 1.1rem; }
        .result-item { background: white; padding: 20px; border-radius: 14px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .result-title a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 1.2rem; }
        .meta { font-size: 0.85rem; color: #86868b; margin-top: 8px; }
    </style>
</head>
<body>
<div class="wrap">
    <header style="text-align:center; padding: 30px 0;">
        <h1>Bibliothèque numérique</h1>
        <p>Patrice Salini</p>
    </header>

    <div class="search-area">
        <input type="text" id="search-input" placeholder="Rechercher (ex: rail, fret...)" autofocus>
        <div style="margin-top:10px; display:flex; justify-content:space-between;">
            <span id="counter">Chargement...</span>
            <button onclick="toggleSort()" id="sortBtn" style="cursor:pointer; background:none; border:1px solid #ccc; border-radius:5px;">📅 Trier par date</button>
        </div>
    </div>
    <div id="results-list"></div>
</div>

<script>
let DATA = [];
let RECENT_FIRST = true;

const GLOSSARY = { "rail": "ferroviaire", "ferroviaire": "rail", "fret": "marchandises" };

function getNumericDate(it) {
    // FORCE la date pour a0003 si elle est mal détectée
    if (it.title.includes("a0003")) return 20250302;
    
    const s = (it.date || "").toString();
    const m = s.match(/\b(19|20)\d{2}\b/);
    let year = m ? parseInt(m[0]) : 1900;
    
    // Si format JJ/MM/AAAA
    const full = s.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if (full) return parseInt(full[3]+full[2]+full[1]);
    
    return year * 10000;
}

async function start() {
    const r = await fetch('index.json?v=' + Date.now());
    DATA = await r.json();
    document.getElementById('search-input').oninput = update;
    update();
}

function toggleSort() {
    RECENT_FIRST = !RECENT_FIRST;
    update();
}

function update() {
    const q = document.getElementById('search-input').value.toLowerCase().trim();
    const syn = GLOSSARY[q] || "";

    let filtered = DATA.map(it => {
        let score = 0;
        const txt = (it.title + " " + it.description).toLowerCase();
        if (q && (txt.includes(q) || (syn && txt.includes(syn)))) {
            score = txt.includes(q) ? 100 : 50;
            if (it.title.toLowerCase().includes(q)) score += 50;
        }
        return { ...it, score, dateVal: getNumericDate(it) };
    });

    if (q) {
        filtered = filtered.filter(it => it.score > 0);
        filtered.sort((a, b) => b.score - a.score || b.dateVal - a.dateVal);
    } else {
        filtered.sort((a, b) => RECENT_FIRST ? b.dateVal - a.dateVal : a.dateVal - b.dateVal);
    }

    render(filtered);
}

function render(list) {
    const container = document.getElementById('results-list');
    document.getElementById('counter').innerText = list.length + " document(s)";
    container.innerHTML = list.map(it => {
        // RÉPARATION DU LIEN : on s'assure que l'URL est complète
        let url = it.url || "";
        if (!url.startsWith('http')) url = "pdf/" + it.title + ".pdf";

        return `
        <div class="result-item">
            <div class="result-title">
                <a href="${url}" target="_blank">${it.description.substring(0,120)}...</a>
            </div>
            <div class="meta">📅 ${it.date || 'Archive'} | Réf: ${it.title}</div>
        </div>
    `}).join('');
}
window.onload = start;
</script>
</body>
</html>
