<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bibliothèque Patrice Salini</title>
    <style>
        :root { --accent: #0071e3; --pdf: #d93025; --web: #1a73e8; }
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; margin: 0; color: #1d1d1f; }
        .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 25px; background: white; border-bottom: 1px solid #ddd; }
        .links-ref { margin-top: 15px; }
        .links-ref a { color: var(--accent); text-decoration: none; margin: 0 15px; font-weight: bold; border-bottom: 2px solid transparent; }
        .links-ref a:hover { border-bottom-color: var(--accent); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 20px; }
        .card { background: white; padding: 18px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .is-pdf { border-left-color: var(--pdf); }
        .is-web { border-left-color: var(--web); }
        .card a { color: var(--accent); text-decoration: none; font-weight: bold; font-size: 1.1rem; display: block; margin-bottom: 5px; }
        .meta { font-size: 0.85rem; color: #666; margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; }
        .search-area { position: sticky; top: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 20px; z-index: 100; border-bottom: 1px solid #eee; }
        #search-input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #ccc; font-size: 1.1rem; }
        .btn-sort { padding: 10px 20px; cursor: pointer; background: #1d1d1f; color: white; border: none; border-radius: 8px; margin-top: 10px; font-weight: bold; }
        @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<header>
    <h1>Ma Bibliothèque Numérique</h1>
    <div class="links-ref">
        <a href="https://pensertransports.simdif.com" target="_blank">🌐 Penser les transports (C. Reynaud & P. Salini)</a>
        <a href="https://www.editions-harmattan.fr/catalogue/auteur/patrice-salini/15031" target="_blank">📚 Mes Livres (Ed. Harmattan)</a>
    </div>
</header>
<div class="wrap">
    <div class="search-area">
        <input type="text" id="search-input" placeholder="Rechercher (ex: rail, fret, fluvial, combiné...)">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <p id="counter" style="font-weight:bold;">Chargement...</p>
            <button id="sortBtn" class="btn-sort">📅 Trier par Date</button>
        </div>
    </div>
    <div class="grid">
        <section><h2>📄 Archives & Notes (PDF)</h2><div id="pdf-list"></div></section>
        <section><h2>🌐 Articles Web (Penser les Transports)</h2><div id="web-list"></div></section>
    </div>
</div>
<script>
let DATA = [];
let RECENT = true;

// Glossaire Inverse issu de ton expertise
const GLOSSAIRE = {
    "fret": ["marchandises", "choses", "logistique"],
    "marchandises": ["fret"],
    "rail": ["ferroviaire", "sncf", "train", "ferré", "chemin de fer"],
    "ferroviaire": ["rail", "sncf"],
    "fluvial": ["canal", "canaux", "voie d'eau", "vn", "vnav", "écluse"],
    "routier": ["camion", "poids lourd", "pl", "autoroute"],
    "combiné": ["intermodal", "ferroutage", "multimodal", "rail-route", "piggyback"],
    "sss": ["cabotage", "short-sea", "maritime"],
    "oest": ["observatoire", "statistiques"],
    "plan": ["planification", "stratégie", "commissariat"]
};

function getVal(it) {
    if (it.title.toLowerCase().includes("a0003")) return 20260302;
    let m = (it.date || "").match(/\d{4}/);
    return m ? parseInt(m[0]) * 10000 : 19000000;
}

async function start() {
    const r = await fetch('index.json?v=' + Date.now());
    DATA = await r.json();
    update();
}

function update() {
    const q = document.getElementById('search-input').value.toLowerCase().trim();
    
    // Logique de recherche avec Glossaire
    let terms = [q];
    if (q.length > 2) {
        for (let key in GLOSSAIRE) {
            if (q.includes(key) || GLOSSAIRE[key].some(a => q.includes(a))) {
                terms = [...new Set([...terms, key, ...GLOSSAIRE[key]])];
            }
        }
    }

    let filtered = DATA.filter(it => {
        if (!q) return true;
        const text = (it.title + " " + (it.description || "") + " " + (it.keywords || []).join(" ")).toLowerCase();
        return terms.some(t => text.includes(t));
    });

    filtered.sort((a,b) => RECENT ? getVal(b) - getVal(a) : getVal(a) - getVal(b));

    const pL = document.getElementById('pdf-list');
    const wL = document.getElementById('web-list');
    pL.innerHTML = ""; wL.innerHTML = "";

    filtered.forEach(it => {
        let url = it.url || it.path || "";
        // Suppression forcée de /pdf/ car tout est à la racine
        url = url.replace('https://patintosh.github.io/transport/pdf/', '');
        url = url.replace('/pdf/', '');
        
        const isPdf = url.toLowerCase().includes('.pdf');
        
        let title = it.title;
        // Si titre = code, on prend la description signifiante
        if (title.match(/^[a-z]\d{4}$/i) && it.description) {
            title = it.description.split('.')[0].substring(0, 100);
        }

        const html = `
            <div class="card ${isPdf?'is-pdf':'is-web'}">
                <a href="${url}" target="_blank">${title}</a>
                <div class="meta">📅 ${it.date || ''} | <small>Réf: ${it.title}</small></div>
            </div>`;
            
        if(isPdf) pL.innerHTML += html; else wL.innerHTML += html;
    });
    document.getElementById('counter').innerText = filtered.length + " doc(s) trouvé(s)";
}

document.getElementById('search-input').oninput = update;
document.getElementById('sortBtn').onclick = () => { RECENT = !RECENT; update(); };
window.onload = start;
</script>
</body>
</html>
