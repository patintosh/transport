<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bibliothèque numérique de Patrice Salini</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="site-header">
    <div class="wrap">
      <h1 class="site-title">Bibliothèque numérique de Patrice Salini</h1>
      <p class="site-subtitle">articles, documents, études publiques sur les transports et la socioéconomie</p>

      <p class="site-link">
        <a href="https://pensertransports.simdif.com" target="_blank" rel="noopener noreferrer">
          Autre site : Penser Transport — cliquer pour aller sur le site partagé avec Christian Reynaud
        </a>
      </p>

      <!-- Dernier article (sera rempli par search.js) -->
      <div id="latest-article" class="latest-article" aria-live="polite"></div>
    </div>
  </header>

  <main class="wrap">
    <section id="search-section" class="search-section">

      <form id="search-form" class="search-form" onsubmit="return false;">
        <label for="searchInput" class="label">Rechercher</label>
        <div class="search-row">
          <input id="searchInput"
                 type="search"
                 placeholder="Tapez un mot‑clé, ex : rail, route, combiné"
                 autocomplete="off"
                 oninput="updateResults()" />
