<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bibliothèque Patrice Salini</title>
    <style>
        :root { --pdf: #d93025; --web: #1a73e8; --bg: #f5f5f7; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; color: #1d1d1f; line-height: 1.5; }
        .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { background: white; padding: 30px; border-bottom: 1px solid #d2d2d7; text-align: center; }
        .search-area { position: sticky; top: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); padding: 20px; border-bottom: 1px solid #d2d2d7; z-index: 1000; }
        #search-input { width: 100%; padding: 16px; font-size: 1.2rem; border-radius: 12px; border: 1px solid #d2d2d7; box-shadow: inset 0 1px 2px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 30px; }
        .card { background: white; padding: 20px; border-radius: 14px; border-left: 6px solid #ccc; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .is-pdf { border-left-color: var(--pdf); }
        .is-web { border-left-color: var(--web); }
        .card a { color: #0071e3; text-decoration: none; font-weight: 700; font-size: 1.15rem; display: block; margin-bottom: 8px; }
        .meta { font-size: 0.9rem; color: #86868b; margin-top: 10px; border-top: 1px solid #f5f5f7; padding-top: 10px; }
        .syn-hint { color: var(--web); font-size: 0.85rem; font-weight: 500; margin-top: 8px; }
        h2 { font-size: 1.5rem; margin-bottom: 20px; border-bottom: 2px solid #1d1d1f; padding-bottom: 8px; }
    </style>
</head>
<body>
<div class="header">
    <h1>Bibliothèque Numérique - Patrice Salini</h1>
    <p>Prospective et Économie des Transports</p>
</div>
<div class="wrap">
    <div class="search-area">
        <input type="text" id="search-input" placeholder="Recherche thématique (ex: rail, tko, ges, fret...)">
        <div id="synonyms-hint" class="syn-hint"></div>
        <p id="counter" style="margin-top:10px; font-weight:bold;"></p>
    </div>
    <div class="grid">
        <section><h2>📄 PDF & Notes d'Archives</h2><div id="pdf-list"></div></section>
        <section><h2>🌐 Pages Web & Articles</h2><div id="web-list"></div></section>
    </div>
</div>
<script>
let DATA = [];
let GLOSSAIRE = {};

async function start() {
    const [resD, resG] = await Promise.all([
        fetch('index.json?v=' + Date.now()).then(r => r.json()),
        fetch('glossaireinverse.json?v=' + Date.now()).then(r => r.json())
    ]);
    DATA = resD;
    GLOSSAIRE = resG;
    render();
}

function render() {
    const q = document.getElementById('search-input').value.toLowerCase().trim();
    const pL = document.getElementById('pdf-list');
    const wL = document.getElementById('web-list');
    const hint = document.getElementById('synonyms-hint');
    pL.innerHTML = ""; wL.innerHTML = "";
    
    // 1. Extension sémantique via le glossaire inverse
    let searchTerms = [q];
    if (q && GLOSSAIRE[q]) {
        searchTerms = [...searchTerms, ...GLOSSAIRE[q]];
        hint.innerText = "Recherche étendue à : " + GLOSSAIRE[q].join(", ");
    } else { hint.innerText = ""; }

    // 2. Filtrage intelligent
    const filtered = DATA.filter(it => {
        if (!q) return true;
        const target = (it.title + " " + (it.description || "") + " " + (it.url || "")).toLowerCase();
        return searchTerms.some(term => target.includes(term));
    });

    // 3. Rendu
    filtered.forEach(it => {
        const url = it.url || "";
        const isPdf = url.toLowerCase().endsWith('.pdf');
        const html = `
            <div class="card ${isPdf ? 'is-pdf' : 'is-web'}">
                <a href="${url}" target="_blank">${it.description || it.title}</a>
                <div class="meta">Réf: ${it.title} | Date: ${it.date}</div>
            </div>`;
        if (isPdf) pL.insertAdjacentHTML('beforeend', html);
        else wL.insertAdjacentHTML('beforeend', html);
    });
    document.getElementById('counter').innerText = filtered.length + " résultat(s) trouvé(s)";
}

document.getElementById('search-input').oninput = render;
window.onload = start;
</script>
</body>
</html>
