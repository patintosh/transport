<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bibliothèque Patrice Salini</title>
    <style>
        :root { --accent: #0071e3; --pdf: #d93025; --web: #1a73e8; }
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; margin: 0; color: #1d1d1f; }
        .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 25px; background: white; border-bottom: 1px solid #ddd; }
        .links-ref { margin-top: 15px; }
        .links-ref a { color: var(--accent); text-decoration: none; margin: 0 15px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 20px; }
        .card { background: white; padding: 18px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .is-pdf { border-left-color: var(--pdf); }
        .is-web { border-left-color: var(--web); }
        .card a { color: var(--accent); text-decoration: none; font-weight: bold; font-size: 1.1rem; display: block; margin-bottom: 5px; }
        .meta { font-size: 0.85rem; color: #666; margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; }
        .search-area { position: sticky; top: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 20px; z-index: 100; border-bottom: 1px solid #eee; }
        #search-input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #ccc; font-size: 1.1rem; }
        .btn-sort { padding: 10px 20px; cursor: pointer; background: #1d1d1f; color: white; border: none; border-radius: 8px; margin-top: 10px; }
        @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<header>
    <h1>Ma Bibliothèque Numérique</h1>
    <div class="links-ref">
        <a href="https://pensertransports.simdif.com" target="_blank">🌐 Penser les transports (C. Reynaud & P. Salini)</a>
        <a href="https://www.editions-harmattan.fr/catalogue/auteur/patrice-salini/15031" target="_blank">📚 Mes Livres</a>
    </div>
</header>
<div class="wrap">
    <div class="search-area">
        <input type="text" id="search-input" placeholder="Rechercher (ex: rail, fret, SSS, oest...)">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <p id="counter" style="font-weight:bold;">Chargement...</p>
            <button id="sortBtn" class="btn-sort">📅 Inverser l'ordre</button>
        </div>
    </div>
    <div class="grid">
        <section><h2>📄 Archives & Notes (PDF)</h2><div id="pdf-list"></div></section>
        <section><h2>🌐 Articles Web (SimDif)</h2><div id="web-list"></div></section>
    </div>
</div>
<script>
let DATA = [];
let RECENT = true;

const GLOSSAIRE = {
    "fret": ["marchandises", "logistique"], "marchandises": ["fret"],
    "rail": ["ferroviaire", "sncf", "train"], "ferroviaire": ["rail", "sncf"]
};

function getScore(it) {
    let t = (it.title || "");
    let d = (it.date || "");
    let desc = (it.description || "");
    
    // PRIORITÉ 1 : Mars 2026 (A0003)
    if (t.toUpperCase().includes("A0003")) return 20260302;
    
    // PRIORITÉ 2 : Les Keynotes récents ou mentions 2025/2026
    if (t.toUpperCase().includes("KEY") || t.includes("2026") || t.includes("2025") || desc.includes("2025")) return 20250000;
    
    // PRIORITÉ 3 : Extraction d'année (4 chiffres entre 1950 et 2024)
    let m = (t + d).match(/(19|20)\d{2}/);
    if (m) return parseInt(m[0]) * 10000;

    // PAR DÉFAUT : Très vieux (pour éviter que Tarnos 463 remonte)
    return 19000000;
}

async function start() {
    const r = await fetch('index.json?v=' + Date.now());
    DATA = await r.json();
    update();
}

function update() {
    const q = document.getElementById('search-input').value.toLowerCase().trim();
    let terms = [q];
    for (let key in GLOSSAIRE) {
        if (q.includes(key) || GLOSSAIRE[key].some(a => q.includes(a))) {
            terms = [...new Set([...terms, key, ...GLOSSAIRE[key]])];
        }
    }

    let filtered = DATA.filter(it => {
        if (!q) return true;
        const txt = (it.title + " " + (it.description || "")).toLowerCase();
        return terms.some(t => txt.includes(t));
    });

    filtered.sort((a,b) => RECENT ? getScore(b) - getScore(a) : getScore(a) - getScore(b));

    const pL = document.getElementById('pdf-list');
    const wL = document.getElementById('web-list');
    pL.innerHTML = ""; wL.innerHTML = "";

    filtered.forEach(it => {
        let url = it.url || it.path || "";
        // RÉPARATION MAJUSCULE : On extrait le nom exact du JSON
        let parts = url.split('/');
        let exactFileName = parts[parts.length - 1]; 
        
        const isPdf = exactFileName.toLowerCase().endsWith('.pdf');
        let displayTitle = it.title;

        // Titre lisible pour les codes A0003, A0231 ou KEY
        if ((it.title.match(/^[A-Za-z]\d{4}$/) || it.title.includes('key')) && it.description) {
            displayTitle = it.description.split('.')[0].substring(0, 110);
        }

        const html = `<div class="card ${isPdf?'is-pdf':'is-web'}">
            <a href="${isPdf ? exactFileName : url}" target="_blank">${displayTitle}</a>
            <div class="meta">📅 ${it.date || 'Archive'} | Réf: ${it.title}</div>
        </div>`;
        
        if(isPdf) pL.innerHTML += html; else wL.innerHTML += html;
    });
    document.getElementById('counter').innerText = filtered.length + " doc(s)";
}

document.getElementById('search-input').oninput = update;
document.getElementById('sortBtn').onclick = () => { RECENT = !RECENT; update(); };
window.onload = start;
</script>
</body>
</html>
