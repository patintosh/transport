<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bibliothèque Patrice Salini</title>
    <style>
        :root { --accent: #0071e3; --pdf: #d93025; --web: #1a73e8; }
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; margin: 0; color: #1d1d1f; }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px; background: white; border-bottom: 1px solid #ddd; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 20px; }
        .card { background: white; padding: 18px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .is-pdf { border-left-color: var(--pdf); }
        .is-web { border-left-color: var(--web); }
        .card a { color: var(--accent); text-decoration: none; font-weight: bold; font-size: 1.1rem; display: block; margin-bottom: 5px; }
        .meta { font-size: 0.85rem; color: #666; margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; }
        .search-area { position: sticky; top: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); padding: 20px; z-index: 100; border-bottom: 1px solid #eee; }
        #search-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; }
    </style>
</head>
<body>
<header>
    <h1>Ma Bibliothèque Numérique</h1>
    <p><a href="https://pensertransports.simdif.com" target="_blank">🌐 Penser les transports</a></p>
</header>
<div class="wrap">
    <div class="search-area">
        <input type="text" id="search-input" placeholder="Rechercher...">
        <p id="counter" style="margin-top:10px; font-weight:bold;">Initialisation...</p>
    </div>
    <div class="grid">
        <section><h2>📄 PDF (Archives & Notes)</h2><div id="pdf-list"></div></section>
        <section><h2>🌐 Web (Articles)</h2><div id="web-list"></div></section>
    </div>
</div>
<script>
let DATA = [];

function getYear(it) {
    // 1. Priorité absolue au document de Mars 2026 (A0003)
    if (it.title.includes("A0003")) return 202603;

    // 2. Extraction stricte de l'année depuis le JSON (date, title ou description)
    // On cherche 4 chiffres consécutifs (ex: 2025)
    let textToScan = (it.date || "") + (it.title || "") + (it.description || "");
    let match = textToScan.match(/(20|19)\d{2}/);
    
    return match ? parseInt(match[0]) : 1900;
}

async function start() {
    const r = await fetch('index.json?v=' + Date.now());
    DATA = await r.json();
    render();
}

function render() {
    const q = document.getElementById('search-input').value.toLowerCase().trim();
    let filtered = DATA.filter(it => (it.title + " " + (it.description || "")).toLowerCase().includes(q));
    
    // Tri par année décroissante
    filtered.sort((a,b) => getYear(b) - getYear(a));

    const pL = document.getElementById('pdf-list');
    const wL = document.getElementById('web-list');
    pL.innerHTML = ""; wL.innerHTML = "";

    filtered.forEach(it => {
        let url = it.url || it.path || "";
        // RÉPARATION CRUCIALE : On extrait le nom exact SANS changer la casse (A0003 reste A0003)
        let fileName = url.split('/').pop(); 
        const isPdf = fileName.toLowerCase().endsWith('.pdf');
        
        // Affichage : Si le titre est court (code), on utilise la description
        let displayTitle = (it.description && it.title.length < 10) ? it.description.split('.')[0] : it.title;

        const html = `<div class="card ${isPdf?'is-pdf':'is-web'}">
            <a href="${isPdf ? fileName : url}" target="_blank">${displayTitle}</a>
            <div class="meta">📅 ${it.date || 'Année non précisée'} | Réf: ${it.title}</div>
        </div>`;
        if(isPdf) pL.innerHTML += html; else wL.innerHTML += html;
    });
    document.getElementById('counter').innerText = filtered.length + " document(s) trouvé(s)";
}

document.getElementById('search-input').oninput = render;
window.onload = start;
</script>
</body>
</html>
