        
# -------------------------------
# Informations générales du site   
# -------------------------------
            
title: " Transport  et  Mélanges "    
description: "Analyses, articles et documents PDF autour des transports, de l’énergie, de la Corse, et des politiques publiques."
        
# -------------------------------
# Thème GitHub Pages
# -------------------------------

theme: jekyll-theme-cayman

# -------------------------------
# Navigation principale (menu)
# -------------------------------

header_pages:
  - index.md
  - maritime/index.md
  - aerien/index.md
  - energie/index.md
  - carburants/index.md
  - developpement/index.md
  - lyon-turin/index.md
  - evaluation/index.md
  - pdf/index.md

# -------------------------------
# Paramètres de rendu Markdown
# -------------------------------

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# -------------------------------
# Plugins GitHub Pages
# -------------------------------

plugins:
  - jekyll-feed

# -------------------------------
# Options Jekyll pour compatibilité
# -------------------------------

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Force le formatage standard
highlighter: rouge
  
