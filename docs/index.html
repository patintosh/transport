<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Transport — Recherche</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Transport</h1>
    <p class="lead">Recherche dans les articles et pages</p>
  </header>

  <main>
    <section id="search-section" aria-labelledby="search-title">
      <h2 id="search-title">Recherche</h2>

      <form id="search-form" role="search" onsubmit="return false;">
        <label for="q" class="visually-hidden">Rechercher</label>
        <input id="q" name="q" type="search" placeholder="Tapez un mot-clé, ex: veolia" autocomplete="off" />
        <button id="search-btn" type="button">Rechercher</button>
      </form>

      <div id="results-info" aria-live="polite"></div>
      <ul id="results" aria-live="polite"></ul>

      <nav id="pager" aria-label="Pagination" hidden>
        <button id="prev">Précédent</button>
        <span id="page-info"></span>
        <button id="next">Suivant</button>
      </nav>
    </section>
  </main>

  <footer>
    <small>© Transport</small>
  </footer>

  <script src="search.js" defer></script>
</body>
</html>
