name: Generer Dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permet de le lancer manuellement depuis l'onglet Actions

jobs:
    build:
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
        - name: Récupérer le dépôt
          uses: actions/checkout@v4

        - name: Configurer Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.10'

        - name: Installer les dépendances
          run: |
            pip install pandas plotly

        - name: Exécuter le script de génération
          run: |
            python generate_dashboard.py

        - name: Sauvegarder et pousser le dashboard généré
          run: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add dashboard.html
            git commit -m "Mise à jour automatique du dashboard" || echo "Aucun changement à commiter"
            git push
