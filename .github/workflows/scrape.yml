name: Scraper Air Corsica

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      # --- Checkout rapide ---
      - name: Checkout rapide
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --- Python ---
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- Installer Playwright + Chromium ---
      - name: Installer Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas
          playwright install chromium

      # --- Debug scraper ---
      - name: Vérifier version du scraper
        run: |
          echo "Contenu du scraper :"
          grep -R "playwright" -n scraper_aircorsica.py || echo "⚠️ ATTENTION : Selenium détecté"

      # --- Lancer le scraping ---
      - name: Lancer le script de scraping
        run: python run_scraper.py

      # --- Générer les séries temporelles ---
      - name: Générer les séries temporelles
        run: python process.py
