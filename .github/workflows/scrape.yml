name: Scraper Air Corsica

on:
  workflow_dispatch: # Permet de lancer le script manuellement depuis l'onglet Actions de GitHub
  schedule:
    - cron: '0 8 * * *' # Optionnel : s'exécute tous les jours à 8h00 UTC (à adapter ou supprimer si inutile)

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Lancer le script de scraping
        run: python scraper_aircorsica.py
