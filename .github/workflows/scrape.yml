name: Pipeline Quotidien Air Corsica

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de l'environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation de pandas et playwright
        run: pip install pandas playwright

      - name: Installation des dépendances système Playwright
        run: sudo playwright install-deps chromium

      - name: Installation du navigateur Chromium
        run: playwright install chromium

      - name: Exécution du script de scraping
        run: python scraper_aircorsica.py

      - name: Exécution du script de nettoyage
        run: python clean_csv.py

      - name: Configuration de l'identité Git
        run: |
          git config --global user.name 'Air Corsica Bot'
          git config --global user.email 'bot@users.noreply.github.com'

      - name: Ajout du fichier CSV au suivi Git
        run: git add vols_aircorsica.csv

      - name: Validation et envoi des modifications
        run: |
          git diff --staged --quiet || git commit -m "Mise à jour automatique des prix du $(date +%Y-%m-%d)"
          git push
