name: Pipeline Quotidien Air Corsica

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de l'environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install pandas playwright

      - name: Installation de Playwright et des dépendances système
        run: playwright install --with-deps chromium

      - name: Exécution du script de scraping
        run: python scraper_aircorsica.py

      - name: Exécution du script de nettoyage
        run: python clean_csv.py

      - name: Configuration de l'identité Git
        run: |
          git config --global user.name 'Air Corsica Bot'
          git config --global user.email 'bot@users.noreply.github.com'

      - name: Validation et envoi des modifications
        run: |
          if [ -f vols_aircorsica.csv ]; then
            git add vols_aircorsica.csv
            git diff --staged --quiet || git commit -m "Mise à jour automatique des prix du $(date +%Y-%m-%d)"
            git push
          else
            echo "⚠️ Le fichier vols_aircorsica.csv n'existe pas, aucun commit effectué."
          fi
