name: Scrape Air Corsica

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas playwright
          playwright install chromium

      - name: Run Scraper
        run: python scrape.py

      - name: Generate J+7 Time Series
        run: python process.py

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vols_aircorsica.csv series_temporelles_j7.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Mise à jour automatique des données et séries J+7"
          git push
