name: Scrape and Process Air Corsica

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run Air Corsica Scraper
        run: python scraper_aircorsica.py

      - name: Run J+7 Processing
        run: python process.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Mise à jour automatique des prix et des séries J+7"
          file_pattern: "*.csv index.html"
