name: Pipeline Aircorsica Dashboard

on:
  schedule:
    - cron: '0 7 * * *'  # Exécution automatique chaque jour à 7h00
  workflow_dispatch:     # Bouton pour forcer la mise à jour manuellement à la demande

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas plotly

      - name: Run dashboard generator
        run: python generate_dashboard.py

      - name: Commit and push if HTML changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour du dashboard [skip ci]" && git push)
