name: Scraper Air Corsica

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests pandas plotly

      - name: Run scraper
        run: |
          python scraper_aircorsica.py

      - name: Generate dashboard
        run: |
          python generate_dashboard.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add résultats_aircorsica.csv routes_aircorsica/ docs/
          git commit -m "Update Air Corsica data"
          git push
