name: Aircorsica Scraper & Dashboard

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6 * * *'  # Activable plus tard pour le cron quotidien

jobs:
  scrape-and-build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Python
        run: python --version

      - name: Install dependencies
        run: pip install requests pandas plotly simplejson playwright

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run Scraper
        run: python scraper.py

      - name: Generate Dashboard
        run: python generate_dashboard.py
