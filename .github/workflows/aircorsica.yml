name: Air Corsica UDT Pipeline

on:
  schedule:
    - cron: '0 7 * * *'  # Tous les jours à 07:00 UTC
  workflow_dispatch:      # Permet aussi un lancement manuel depuis l'interface GitHub

jobs:
  run-pipeline:
    runs-on: self-hosted  # Utilise ton Mac comme runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute run script
        run: |
          chmod +x ./run.sh
          ./run.sh
