name: Scraper Air Corsica

on:
  workflow_dispatch:
  # Tu pourras ajouter un schedule ici si besoin (ex: cron: '0 7 * * *')

jobs:
  scrape:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Chrome profile
        run: cp -R ~/scraper_corse/chrome_profile ./chrome_profile || true

      - name: Use Miniconda Python
        run: python --version

      - name: Install dependencies
        run: pip install requests pandas plotly simplejson playwright

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Run scraper (Batch mode)
        run: /opt/miniconda3/bin/python scraperapi.py --mode batch

      - name: Generate Dashboard and Charts
        run: /opt/miniconda3/bin/python generate_dashboard.py

      - name: Commit and push results
        run: |
          git config --global user.email "patrice.salini@me.com"
          git config --global user.name "Patrice"
          git add .
          git commit -m "Mise automatique des prix et du dashboard" || echo "Nothing to commit"
          git push
