name: Aircorsica Scraper & Dashboard

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6 * * *'

jobs:
  scrape-and-build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Scraper Pipeline
        run: |
          export PATH="$HOME/miniconda3/bin:$HOME/anaconda3/bin:/opt/miniconda3/bin:$PATH"
          
          echo "--- Vérification Python & Pip ---"
          python --version
          
          echo "--- Installation des dépendances ---"
          pip install requests pandas plotly simplejson playwright
          
          echo "--- Installation des navigateurs Playwright ---"
          python -m playwright install chromium
          
          echo "--- Exécution du script de scraping ---"
          python scraper.py
          
          echo "--- Génération du dashboard ---"
          python generate_dashboard.py
