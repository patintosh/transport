name: Aircorsica Scraper & Dashboard

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6 * * *'

jobs:
  scrape-and-build:
  # On force le runner à travailler directement dans ton dossier local existant
    runs-on: self-hosted

    steps:
      - name: Run Scraper Pipeline directly from local folder
        run: |
          export PATH="$HOME/miniconda3/bin:$HOME/anaconda3/bin:/opt/miniconda3/bin:$PATH"
          
          # On se place directement dans ton vrai dossier de travail sur le Mac
          cd /Users/macbookairsalini/scraper_corse
          
          echo "--- Dossier de travail actuel ---"
          pwd
          
          echo "--- Exécution du script de scraping ---"
          python scraperapi.py
          
          echo "--- Génération du dashboard ---"
          python generate_dashboard.py
